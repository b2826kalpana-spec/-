name: Build atlas data
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'vendor/**'
      - 'Global-Atlas.zip'
  workflow_dispatch:
concurrency:
  group: global-atlas-build-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tooling
        run: pip install --disable-pip-version-check shapely countryinfo Babel pycountry
      - name: Generate local atlas datasets
        run: python scripts_build_data.py
      - name: Vendor Three.js for offline WebGL
        run: |
          rm -rf vendor package three-0.152.2.tgz
          mkdir -p vendor
          npm pack three@0.152.2 --silent
          tar -xzf three-0.152.2.tgz package/build/three.min.js
          cp package/build/three.min.js vendor/three.min.js
          rm -rf package three-0.152.2.tgz
      - name: Smoke test atlas
        run: |
          node --check js/app.js
          if [ -f js/globe.js ]; then node --check js/globe.js; fi
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}}; vm.createContext(context);
          for(const f of ['data/world-data.js','data/country-meta.js','data/special-territories.js']) vm.runInContext(fs.readFileSync(f,'utf8'),context);
          const w=context.window;
          if(!w.ATLAS_WORLD || w.ATLAS_WORLD.features.length < 150) throw new Error('World geometry dataset is incomplete');
          if(!w.ATLAS_META || Object.keys(w.ATLAS_META).length < 150) throw new Error('Country metadata dataset is incomplete');
          if(!w.ATLAS_SPECIAL || w.ATLAS_SPECIAL.features.length !== 6) throw new Error('Special territory layer must contain exactly 6 geometries');
          if(!fs.existsSync('vendor/three.min.js') || fs.statSync('vendor/three.min.js').size < 100000) throw new Error('Offline Three.js vendor bundle is missing');
          console.log('QA:',w.ATLAS_WORLD.features.length,'map features,',Object.keys(w.ATLAS_META).length,'country records,',w.ATLAS_SPECIAL.features.length,'territories');
          NODE
      - name: Package desktop ZIP
        run: |
          rm -f Global-Atlas.zip
          zip -X -r Global-Atlas.zip index.html css js data vendor README.md .nojekyll -x '*.DS_Store'
      - name: Commit generated datasets, vendor and ZIP
        run: |
          git config user.name "global-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data vendor Global-Atlas.zip
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh atlas datasets, WebGL vendor and ZIP"
          git push
