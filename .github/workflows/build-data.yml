name: Build atlas data
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tooling
        run: pip install --disable-pip-version-check shapely countryinfo Babel pycountry
      - name: Generate local atlas datasets
        run: python scripts_build_data.py
      - name: Commit generated datasets
        run: |
          git config user.name "global-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "build: generate atlas datasets"
          git push
