name: Build FINKE Sudoku with six difficulty levels
on:
  push:
    paths:
      - ".github/workflows/finke-sudoku-six-levels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch original APK with six actual levels
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_sudoku_six_levels.py
          node --check finke-game-tested.js

      - name: Test all six difficulty generators
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const {LEVELS, generatePuzzle, countSolutions, hashCode} = require('./finke-game-tested.js');
          const names = Object.keys(LEVELS);
          assert.deepEqual(names, ['beginner', 'easy', 'medium', 'hard', 'expert', 'master']);
          let cases = 0;
          for (const name of names) {
            const counts = [];
            for (let n=0;n<5;n++) {
              const p=generatePuzzle(name,hashCode('six-modes-'+name+'-'+n));
              assert.equal(p.puzzle.length,81);
              assert.equal(p.solution.length,81);
              assert.equal(countSolutions(p.puzzle.slice(),2),1);
              assert.ok(p.clues<=81 && p.clues>=17);
              for(let r=0;r<9;r++){
                assert.equal(new Set(p.solution.slice(r*9,r*9+9)).size,9);
                assert.equal(new Set(Array.from({length:9},(_,c)=>p.solution[c*9+r])).size,9);
              }
              counts.push(p.clues);cases++;
            }
            console.log(name, LEVELS[name].name, 'given clues:', counts.join(', '));
          }
          console.log('VERIFIED', cases,'generated puzzles with one solution each');
          JS

      - name: Align and sign Android 5+ installable APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/apksigner" || { echo "Missing Android SDK build tools"; exit 1; }
          SOURCE="downloads/FINKE-Sudoku-v3.0-six-levels-unsigned.apk"
          ALIGNED="/tmp/finke-sudoku-aligned.apk"
          OUTPUT="downloads/FINKE-Sudoku-v3.0-six-levels.apk"
          "$BT/zipalign" -f -p 4 "$SOURCE" "$ALIGNED"
          keytool -genkeypair -v -keystore /tmp/finke-sudoku-signing.keystore -storepass android -keypass android -alias finke -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=FINKE Sudoku,O=FINKE" >/dev/null 2>&1
          "$BT/apksigner" sign --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --ks /tmp/finke-sudoku-signing.keystore --ks-key-alias finke --ks-pass pass:android --key-pass pass:android --out "$OUTPUT" "$ALIGNED"
          "$BT/apksigner" verify --min-sdk-version 21 --verbose "$OUTPUT"
          "$BT/zipalign" -c -p 4 "$OUTPUT"
          python3 - <<'PY'
          import os, zipfile, hashlib
          p='downloads/FINKE-Sudoku-v3.0-six-levels.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert {'AndroidManifest.xml','classes.dex','assets/index.html','assets/game.js','assets/luxury.css'}.issubset(names)
              html=z.read('assets/index.html').decode('utf-8')
              assert html.count('data-level=')==6
          print('VERIFIED signed six-level APK:',os.path.getsize(p),'bytes',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY

      - name: Publish APK to downloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/FINKE-Sudoku-v3.0-six-levels.apk
          git commit -m "Publish signed FINKE Sudoku v3.0 with six difficulty levels"
          git push origin HEAD:main
